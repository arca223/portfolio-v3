name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # PAGES_BASE (repository variable, Settings > Secrets and variables > Actions > Variables):
      #   '/'              for a user site (arca223.github.io)
      #   '/portfolio-v3/' for a project repository served under /portfolio-v3/
      # CONTACT_EMAIL (repository secret): encoded at build time by vite.config.ts,
      #   never committed and never present in plain text in the built files.
      - name: Build
        run: npm run build -- --base=${{ vars.PAGES_BASE || '/' }}
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}

      # SPA fallback: GitHub Pages serves 404.html for unknown paths (deep links).
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
