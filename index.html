<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maxime Cocquempot — Freelance Software Engineer</title>
    <meta
      name="description"
      content="Portfolio of Maxime Cocquempot, freelance software engineer: experience, missions, skills and how to get in touch."
    />
    <meta name="theme-color" content="#09090b" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link
      rel="preload"
      href="/fonts/inter-latin-wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Apply the theme before first paint to avoid a flash.
      (function () {
        var theme = null
        try {
          theme = localStorage.getItem('theme')
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        var root = document.documentElement
        root.classList.toggle('dark', theme === 'dark')
        root.style.colorScheme = theme
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#09090b' : '#ffffff')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
